name: soongan CI

on:
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore Base64
        run: |
          mkdir -p keystore
          echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 --decode > keystore/debug.keystore
          echo "${{ secrets.RELEASE_KEYSTORE_JKS }}" | base64 --decode > keystore/release.keystore.jks

      - name: Create Properties & Google Services JSON
        env:
          LOCAL_PROPERTIES: ${{secrets.LOCAL_PROPERTIES}}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          SECRETS_PROPERTIES: ${{ secrets.SECRETS_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{secrets.GOOGLE_SERVICES_JSON}}
        run: |
          echo "$LOCAL_PROPERTIES" > local.properties
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
          echo "$SECRETS_PROPERTIES" > secrets.properties
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # detekt 실행
      - name: Run detekt
        id: detekt
        run: ./gradlew detekt

      - name: Upload Detekt SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: build/reports/detekt/merge.sarif

      - name: Build assembleDebug
        run: ./gradlew assembleDebug